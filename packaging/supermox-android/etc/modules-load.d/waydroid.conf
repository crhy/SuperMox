# Android's bind mounts go through the binder API. Waydroid's container
# cannot start without this module, and the device arguments have to be
# given at load time, so they live here instead of in the setup script
# (which only covers the current boot). /etc/init.d/kmod passes the whole
# line to modprobe: module first, arguments after.
binder_linux devices=binder,hwbinder,vndbinder
