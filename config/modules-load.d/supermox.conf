# Kernel modules SuperMox loads at boot (rcS.d/S06kmod reads /etc/modules-load.d/*.conf).
# QEMU hands the guest its NIC as a virtio-net-pci device, and the driver is not in the
# kernel's initramfs; on a sysvinit boot nothing autoloads it, so eth0 never exists and
# /etc/init.d/networking (rcS.d/S10networking, which runs after kmod) has nothing to configure.
virtio_net
